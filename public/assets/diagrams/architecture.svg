<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #0e0f11; stroke: rgba(255,255,255,0.18); stroke-width: 1; rx: 6; }
      .text { font-family: 'Geist Mono', monospace; font-size: 11px; fill: #ededed; }
      .subtext { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #9d9d9d; }
      .arrow { stroke: rgba(255,255,255,0.3); stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="rgba(255,255,255,0.3)" />
    </marker>
  </defs>
  
  <text x="400" y="30" font-family="system-ui, -apple-system" font-size="14" font-weight="600" text-anchor="middle" fill="#ededed">System Architecture</text>
  
  <!-- Frontend -->
  <rect x="50" y="80" width="140" height="60" class="box"/>
  <text x="120" y="105" class="text" text-anchor="middle">Frontend UI</text>
  <text x="120" y="122" class="subtext" text-anchor="middle">Vite + TypeScript</text>
  
  <!-- API/Keepers -->
  <rect x="330" y="80" width="140" height="60" class="box"/>
  <text x="400" y="105" class="text" text-anchor="middle">Keepers / Services</text>
  <text x="400" y="122" class="subtext" text-anchor="middle">TypeScript Node</text>
  
  <!-- Contracts -->
  <rect x="610" y="80" width="140" height="60" class="box"/>
  <text x="680" y="105" class="text" text-anchor="middle">Smart Contracts</text>
  <text x="680" y="122" class="subtext" text-anchor="middle">Solidity + Foundry</text>
  
  <!-- Arrows -->
  <line x1="190" y1="110" x2="330" y2="110" class="arrow"/>
  <line x1="470" y1="110" x2="610" y2="110" class="arrow"/>
  
  <!-- Randomness -->
  <rect x="470" y="200" width="120" height="50" class="box"/>
  <text x="530" y="222" class="text" text-anchor="middle">VRF</text>
  <text x="530" y="238" class="subtext" text-anchor="middle">Chainlink / Quiver</text>
  
  <line x1="530" y1="200" x2="640" y2="140" class="arrow"/>
  
  <!-- Indexer -->
  <rect x="210" y="200" width="120" height="50" class="box"/>
  <text x="270" y="222" class="text" text-anchor="middle">Indexer</text>
  <text x="270" y="238" class="subtext" text-anchor="middle">Event Tracking</text>
  
  <line x1="270" y1="200" x2="360" y2="140" class="arrow"/>
  <line x1="330" y1="200" x2="190" y2="140" class="arrow"/>
  
  <text x="400" y="320" font-family="Geist Mono, monospace" font-size="10" text-anchor="middle" fill="#6c6c6c">Escrow • Settlement • Keepers • Verifiable Randomness</text>
</svg>
