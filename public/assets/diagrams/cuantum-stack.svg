<svg width="1100" height="640" viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card { fill: #0e0f11; stroke: rgba(255,255,255,0.14); stroke-width: 1; rx: 8; }
      .cat { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.12em; fill: #6c6c6c; }
      .chip { fill: #121418; stroke: rgba(255,255,255,0.14); stroke-width: 1; rx: 5; }
      .chiptxt { font-family: 'Geist Mono', monospace; font-size: 11px; fill: #dedede; }
    </style>
  </defs>

  <text x="550" y="30" font-family="system-ui, -apple-system" font-size="14" font-weight="600" text-anchor="middle" fill="#ededed">Cuantum — Stack</text>

  <!-- Frontend -->
  <rect x="40" y="64" width="320" height="170" class="card"/>
  <text x="58" y="88" class="cat">FRONTEND</text>
  <rect x="58" y="104" width="120" height="30" class="chip"/><text x="70" y="124" class="chiptxt">Next.js 14</text>
  <rect x="188" y="104" width="120" height="30" class="chip"/><text x="200" y="124" class="chiptxt">React 18</text>
  <rect x="58" y="144" width="120" height="30" class="chip"/><text x="70" y="164" class="chiptxt">Tailwind CSS 4</text>
  <rect x="188" y="144" width="120" height="30" class="chip"/><text x="200" y="164" class="chiptxt">Lucide</text>
  <rect x="58" y="184" width="120" height="30" class="chip"/><text x="70" y="204" class="chiptxt">SSE client</text>
  <rect x="188" y="184" width="120" height="30" class="chip"/><text x="200" y="204" class="chiptxt">html2canvas</text>

  <!-- Backend -->
  <rect x="390" y="64" width="320" height="170" class="card"/>
  <text x="408" y="88" class="cat">BACKEND</text>
  <rect x="408" y="104" width="120" height="30" class="chip"/><text x="420" y="124" class="chiptxt">Node.js 20+</text>
  <rect x="538" y="104" width="120" height="30" class="chip"/><text x="550" y="124" class="chiptxt">Express 4</text>
  <rect x="408" y="144" width="120" height="30" class="chip"/><text x="420" y="164" class="chiptxt">JWT · bcrypt</text>
  <rect x="538" y="144" width="120" height="30" class="chip"/><text x="550" y="164" class="chiptxt">Nodemailer</text>
  <rect x="408" y="184" width="120" height="30" class="chip"/><text x="420" y="204" class="chiptxt">node-fetch</text>
  <rect x="538" y="184" width="120" height="30" class="chip"/><text x="550" y="204" class="chiptxt">dotenv</text>

  <!-- Trading -->
  <rect x="740" y="64" width="320" height="170" class="card"/>
  <text x="758" y="88" class="cat">TRADING ENGINE</text>
  <rect x="758" y="104" width="120" height="30" class="chip"/><text x="770" y="124" class="chiptxt">CCXT 4</text>
  <rect x="888" y="104" width="154" height="30" class="chip"/><text x="900" y="124" class="chiptxt">Binance connector</text>
  <rect x="758" y="144" width="120" height="30" class="chip"/><text x="770" y="164" class="chiptxt">Pine Script</text>
  <rect x="888" y="144" width="154" height="30" class="chip"/><text x="900" y="164" class="chiptxt">V2 / V3 / Grid-ATR</text>
  <rect x="758" y="184" width="120" height="30" class="chip"/><text x="770" y="204" class="chiptxt">TP: OB / 3-level</text>
