  <rect x="208" y="298" width="120" height="30" class="chip"/><text x="220" y="318" class="chiptxt">Mongoose 8</text>
  <rect x="58" y="338" width="140" height="30" class="chip"/><text x="70" y="358" class="chiptxt">Indexed collections</text>
