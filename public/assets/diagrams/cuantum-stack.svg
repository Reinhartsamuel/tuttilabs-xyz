  <rect x="390" y="258" width="320" height="170" class="card"/>
  <text x="408" y="282" class="cat">CHAIN</text>
  <rect x="408" y="298" width="140" height="30" class="chip"/><text x="420" y="318" class="chiptxt">ethers v6</text>
  <rect x="558" y="298" width="120" height="30" class="chip"/><text x="570" y="318" class="chiptxt">BSC / BEP20</text>
  <rect x="408" y="338" width="140" height="30" class="chip"/><text x="420" y="358" class="chiptxt">USDT deposits</text>
  <rect x="558" y="338" width="120" height="30" class="chip"/><text x="570" y="358" class="chiptxt">eth_getLogs</text>
  <rect x="408" y="378" width="140" height="30" class="chip"/><text x="420" y="398" class="chiptxt">HD deposit addrs</text>
  <rect x="558" y="378" width="120" height="30" class="chip"/><text x="570" y="398" class="chiptxt">Treasury sweeps</text>

  <!-- Infra -->
  <rect x="740" y="258" width="320" height="170" class="card"/>
  <text x="758" y="282" class="cat">INFRA</text>
  <rect x="758" y="298" width="120" height="30" class="chip"/><text x="770" y="318" class="chiptxt">PM2</text>
  <rect x="888" y="298" width="154" height="30" class="chip"/><text x="900" y="318" class="chiptxt">Nginx reverse proxy</text>
  <rect x="758" y="338" width="120" height="30" class="chip"/><text x="770" y="358" class="chiptxt">Let's Encrypt</text>
  <rect x="888" y="338" width="154" height="30" class="chip"/><text x="900" y="358" class="chiptxt">VPS (Linux)</text>
  <rect x="758" y="378" width="120" height="30" class="chip"/><text x="770" y="398" class="chiptxt">Vercel (FE)</text>
  <rect x="888" y="378" width="154" height="30" class="chip"/><text x="900" y="398" class="chiptxt">Health checks</text>

  <text x="550" y="478" font-family="Geist Mono, monospace" font-size="10" text-anchor="middle" fill="#6c6c6c">Frontend on Vercel · API + workers + watcher co-located on one VPS · single-writer background jobs</text>
  <text x="550" y="500" font-family="Geist Mono, monospace" font-size="10" text-anchor="middle" fill="#6c6c6c">REST for reads, Server-Sent Events for live positions, webhooks for TradingView alerts</text>
</svg>
