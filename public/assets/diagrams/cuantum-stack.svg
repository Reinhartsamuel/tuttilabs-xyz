  <rect x="58" y="378" width="140" height="30" class="chip"/><text x="70" y="398" class="chiptxt">StrategyState JSON</text>
  <rect x="208" y="378" width="120" height="30" class="chip"/><text x="220" y="398" class="chiptxt">Idempotency keys</text>

